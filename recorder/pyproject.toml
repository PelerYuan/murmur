[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "murmur-recorder"
version = "0.1.0"
description = "Murmur recorder: always-on microphone capture, VAD chunking and resilient upload to Murmur Core"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "httpx>=0.25",
    "webrtcvad-wheels>=2.0.10",
    "soxr>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
murmur-recorder = "murmur_recorder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
