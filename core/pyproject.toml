[project]
name = "murmur-core"
version = "0.1.0"
description = "Murmur core: ingest, transcription pipeline, speakers, summaries, to-dos and web API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "cryptography>=42",
    "python-multipart>=0.0.9",
    "numpy>=1.24",
    "tzdata",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "boto3>=1.34", "moto[s3]>=5"]

[project.scripts]
murmur-core = "murmur_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/murmur_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
